# 2.4 GHz access point — the default. Start here.
# Run: sudo hostapd setup/hostapd-24.conf
interface=wlp3s0
driver=nl80211
ssid=WBA-DEMO
country_code=IN
hw_mode=g
channel=6

# The AP must advertise HE (Wi-Fi 6) on 2.4 GHz, or a modern phone will
# negotiate plain HT rates and the poller will read it as "wifi4" — making
# the client look 2.4-only when the limitation is actually ours.
ieee80211n=1
ieee80211ax=1
he_su_beamformer=1
he_su_beamformee=1

wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=analyzer2026

# If hostapd refuses to start with ieee80211ax=1 (hostapd < 2.10, or a driver
# without 2.4 GHz HE support), comment out the three he_/ax lines above. The
# engine then falls back to the observed-absence path: sample the device on
# 5 GHz first so capability is proven by observation, not inferred from PHY.
ieee80211d=1

# ---------------------------------------------------------------------------
# Control interface — REQUIRED for hostapd_cli, and therefore for rrm.py.
# Without it there is no way to send a beacon request or a transition request.
# ---------------------------------------------------------------------------
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# ---------------------------------------------------------------------------
# 802.11k — Radio Resource Management
#
# rrm_beacon_report is the important one. It lets the AP ask a client to
# report what IT measures: its own RSSI and the actual noise floor on each
# channel. Everything the poller reads from `iw station dump` is the UPLINK
# (how well the laptop hears the phone) and its SNR is derived by subtracting
# an ASSUMED noise floor. A beacon report replaces both assumptions with a
# measurement from the client's own radio.
#
# rrm_neighbor_report advertises other APs. With a single radio there are no
# neighbours to report, so it is enabled for protocol completeness rather
# than for data.
# ---------------------------------------------------------------------------
rrm_neighbor_report=1
rrm_beacon_report=1

# ---------------------------------------------------------------------------
# 802.11v — Wireless Network Management
#
# bss_transition lets the AP ask a client to move, instead of the current
# procedure of killing hostapd and hoping the phone re-associates. With one
# radio you cannot steer between bands (both would have to beacon at once),
# but a BSS Transition Management request with disassoc_imminent does force
# a re-scan, which is what the cross-band test actually needs.
# ---------------------------------------------------------------------------
bss_transition=1
wnm_sleep_mode=1
time_advertisement=2
time_zone=IST-5:30
