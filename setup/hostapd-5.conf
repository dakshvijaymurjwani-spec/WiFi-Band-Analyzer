# 5 GHz access point. SSID and passphrase are IDENTICAL to hostapd-24.conf
# on purpose: same network name means the client rejoins by itself and keeps
# the same MAC across the switch, which is what lets the cross-band
# comparison pair the two readings.
#
# FIXED: this file previously said ssid=TEST / wpa_passphrase=12345678 while
# hostapd-24.conf says WBA-DEMO / analyzer2026. The phone therefore saw an
# unknown network after the band switch, never rejoined, and the poller went
# to zero stations -- which reads downstream as "the live feed stopped".
#
# Run: sudo hostapd setup/hostapd-5.conf
# If it refuses to start, try channel=40 then channel=44 (regulatory).
interface=wlp3s0
driver=nl80211
ssid=WBA-DEMO
country_code=IN
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
ieee80211d=1
ieee80211h=0
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=analyzer2026

# ---------------------------------------------------------------------------
# Control interface — REQUIRED for hostapd_cli, and therefore for rrm.py.
# Without it there is no way to send a beacon request or a transition request.
# ---------------------------------------------------------------------------
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# ---------------------------------------------------------------------------
# 802.11k — Radio Resource Management
#
# rrm_beacon_report is the important one. It lets the AP ask a client to
# report what IT measures: its own RSSI and the actual noise floor on each
# channel. Everything the poller reads from `iw station dump` is the UPLINK
# (how well the laptop hears the phone) and its SNR is derived by subtracting
# an ASSUMED noise floor. A beacon report replaces both assumptions with a
# measurement from the client's own radio.
#
# rrm_neighbor_report advertises other APs. With a single radio there are no
# neighbours to report, so it is enabled for protocol completeness rather
# than for data.
# ---------------------------------------------------------------------------
rrm_neighbor_report=1
rrm_beacon_report=1

# ---------------------------------------------------------------------------
# 802.11v — Wireless Network Management
#
# bss_transition lets the AP ask a client to move, instead of the current
# procedure of killing hostapd and hoping the phone re-associates. With one
# radio you cannot steer between bands (both would have to beacon at once),
# but a BSS Transition Management request with disassoc_imminent does force
# a re-scan, which is what the cross-band test actually needs.
# ---------------------------------------------------------------------------
bss_transition=1
wnm_sleep_mode=1
time_advertisement=2
time_zone=IST-5:30# 5 GHz access point. SSID and passphrase are IDENTICAL to hostapd-24.conf
# on purpose: same network name means the client rejoins by itself and keeps
# the same MAC across the switch, which is what lets the cross-band
# comparison pair the two readings.
#
# FIXED: this file previously said ssid=TEST / wpa_passphrase=12345678 while
# hostapd-24.conf says WBA-DEMO / analyzer2026. The phone therefore saw an
# unknown network after the band switch, never rejoined, and the poller went
# to zero stations -- which reads downstream as "the live feed stopped".
#
# Run: sudo hostapd setup/hostapd-5.conf
# If it refuses to start, try channel=40 then channel=44 (regulatory).
interface=wlp3s0
driver=nl80211
ssid=WBA-DEMO
country_code=IN
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
ieee80211d=1
ieee80211h=0
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=12345678
