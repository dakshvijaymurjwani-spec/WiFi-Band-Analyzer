# 5 GHz access point. SSID and passphrase are IDENTICAL to hostapd-24.conf
# on purpose: same network name means the client keeps the same MAC across
# the switch, which is what lets the cross-band comparison pair the readings.
# Run: sudo hostapd setup/hostapd-5.conf
# If it refuses to start, try channel=40 then channel=44 (regulatory).
interface=wlp3s0
driver=nl80211
ssid=TEST
country_code=IN
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
ieee80211d=1
ieee80211h=0
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=12345678
